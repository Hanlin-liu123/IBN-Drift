# configs/real_trace_experiment.yaml
# 真实流量数据集生成配置

# 输出目录
output_dir: "data/real_trace_dataset"

# 控制器配置
controller_ip: "127.0.0.1"
controller_port: 6653
controller_url: "http://127.0.0.1:8080"

# 数据源配置
sndlib_dir: "data/real_traces/sndlib"
traffic_profile_path: null  # MAWI pcap文件路径，如果没有则使用合成

topologies:
  - "geant"

# MAWI解析配置
max_packets: 50000
time_scale_factor: 1.0

# 流量配置
mawi_stats_path: "profiles/mawi_real_stats.json"  
time_scale_factor: 1.0
max_traffic_rate: 10.0


# 实验规模配置
num_routings: 10               # 路由变体数量（最多26）
num_scheduling_configs: 30    # 调度配置数量（最多100）

# 采样配置
normal_duration: 80           # 正常状态采集时间（秒）
drift_samples_per_config: 3   # 每个配置的漂移样本数

# 队列配置（bits）
queue_sizes:
  - 8000
  - 16000
  - 32000
  - 64000

# 调度策略
scheduling_policies:
  - "FIFO"
  - "SP"
  - "WFQ"
  - "DRR"
