# configs/intents/green_intent.yaml
# 
# 绿色意图配置示例
# 
# 核心思想：在满足性能约束的同时，最小化能耗
# 传统监控盲区：性能达标但能耗超标

---
intent_id: "green_qos_intent_001"
name: "视频流绿色意图"
description: "视频流传输意图，同时满足QoS和能耗约束"
version: "1.0"
created_at: "2025-03-17"

# 意图类型
type: "green_qos"

# 流量匹配
match:
  src_ip: "10.0.0.0/24"
  dst_ip: "10.0.1.0/24"
  protocol: "UDP"
  dst_port: 5001
  
# 性能约束（QoS）
performance:
  delay:
    metric: "end_to_end_delay"
    operator: "<="
    threshold: 50          # ms
    unit: "ms"
  
  loss:
    metric: "packet_loss_rate"
    operator: "<="
    threshold: 0.01        # 1%
    unit: "ratio"
  
  bandwidth:
    metric: "throughput"
    operator: ">="
    threshold: 10          # Mbps
    unit: "Mbps"
  
  jitter:
    metric: "delay_jitter"
    operator: "<="
    threshold: 10          # ms
    unit: "ms"

# 能耗约束（绿色）
energy:
  # 最大功耗约束
  max_power:
    metric: "total_network_power"
    operator: "<="
    threshold: 1500        # 瓦特
    unit: "watts"
  
  # 能效约束
  min_efficiency:
    metric: "energy_efficiency"
    operator: ">="
    threshold: 2.0         # Mbps/Watt
    unit: "Mbps/W"
  
  # 节能策略
  optimization:
    mode: "minimize_power"           # minimize_power | balance | maximize_performance
    allow_link_sleep: true           # 允许空闲链路休眠
    consolidation_preferred: true    # 偏好流量聚合
    max_active_devices: 15           # 最大活跃设备数
  
  # 链路休眠策略
  sleep_policy:
    idle_threshold: 0.01             # 利用率低于此值可休眠
    min_sleep_duration: 10           # 最小休眠时间（秒）
    wakeup_delay_tolerance: 100      # 可接受的唤醒延迟（ms）

# 路径约束
path:
  # 必须经过的节点
  waypoints: []
  
  # 必须避开的节点
  avoid_nodes: []
  
  # 最大跳数
  max_hops: 5
  
  # 能耗感知路由
  energy_aware_routing: true

# 时间约束
temporal:
  # 生效时间
  valid_from: "00:00"
  valid_until: "23:59"
  
  # 高峰期特殊策略
  peak_hours:
    time_range: ["09:00-12:00", "14:00-18:00"]
    relaxed_energy_constraint: true  # 高峰期放宽能耗约束
    energy_multiplier: 1.5           # 能耗阈值乘数

# 优先级
priority: 100

# 违约处理
violation:
  # 性能违约
  performance_violation:
    action: "alert"
    severity: "high"
  
  # 能耗违约（隐蔽漂移）
  energy_violation:
    action: "alert_and_optimize"
    severity: "medium"
    auto_consolidation: true         # 自动执行流量聚合

---
# 第二个意图示例：纯节能意图

intent_id: "energy_saving_intent_001"
name: "夜间节能意图"
description: "夜间低负载时段，最大化节能"
type: "energy_saving"

match:
  any: true

performance:
  delay:
    operator: "<="
    threshold: 200         # 放宽延迟约束
    unit: "ms"

energy:
  max_power:
    operator: "<="
    threshold: 500         # 严格能耗约束
    unit: "watts"
  
  optimization:
    mode: "minimize_power"
    allow_link_sleep: true
    aggressive_sleep: true           # 激进休眠策略
    consolidation_preferred: true

temporal:
  valid_from: "22:00"
  valid_until: "06:00"

priority: 50
